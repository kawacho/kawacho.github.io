<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>one-time-code test</title>
</head>
<body style="font-family: -apple-system, sans-serif; padding: 24px; font-size: 18px">
  <h2>one-time-code test</h2>
  <form onsubmit="return false">
    <p>username<br><input type="email" autocomplete="username" style="font-size: 18px; width: 90%"></p>
    <p>password<br><input type="password" autocomplete="current-password" style="font-size: 18px; width: 90%"></p>
    <p>code (one-time-code)<br><input type="text" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" style="font-size: 18px; width: 90%"></p>
    <p>code (plain)<br><input type="text" inputmode="numeric" style="font-size: 18px; width: 90%"></p>
  </form>
</body>
</html>
